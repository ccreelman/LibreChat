version: 1.2.1
cache: true

interface:
  webSearch: true

webSearch:
  searchProvider: "serper"
  rerankerType: "jina"
  serperApiKey: "${SERPER_API_KEY}"
  jinaApiKey: "${JINA_API_KEY}"

endpoints:
  google:
    apiKey: '${GOOGLE_KEY}'
    fileConfig:
      supportedMimeTypes:
        - image/jpeg
        - image/png
        - image/webp
        - image/heic
        - image/heif
        - text/plain
        - text/markdown
        - application/pdf
        - application/msword
        - application/vnd.openxmlformats-officedocument.wordprocessingml.document
